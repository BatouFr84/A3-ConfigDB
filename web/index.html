<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A3-ConfigDB Search</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero"><div><p class="eyebrow">A3-ConfigDB</p><h1>Configuration Search</h1><p id="dataset-summary" class="muted">Loading artificial dataset…</p></div><span class="badge">PUBLIC FIXTURE</span></header>

    <nav class="tabs" aria-label="Search mode">
      <button id="basic-tab" class="tab active" type="button" aria-selected="true">Basic</button>
      <button id="advanced-tab" class="tab" type="button" aria-selected="false">Advanced</button>
    </nav>

    <section id="basic-panel" class="panel" aria-labelledby="basic-tab">
      <h2>Basic search</h2>
      <form id="search-form">
        <div class="form-grid"><label>Root<select id="root" name="root" required></select></label><label>Limit<input id="limit" name="limit" type="number" min="1" max="500" value="100" required></label></div>
        <div class="filters-header"><h3>Filters</h3><button id="add-filter" type="button" class="secondary">Add filter</button></div>
        <div id="filters" class="filters"></div>
        <div class="actions"><button id="search-button" type="submit">Search</button><button id="reset-button" type="button" class="secondary">Reset</button></div>
      </form>
    </section>

    <section id="advanced-panel" class="panel" aria-labelledby="advanced-tab" hidden>
      <h2>Advanced A3QL</h2>
      <p class="muted">Supported: FROM, WHERE, AND, LIMIT, EQ and CONTAINS.</p>
      <label>A3QL query<textarea id="a3ql-source" rows="8" spellcheck="false">FROM CfgVehicles
WHERE scope EQ 2
LIMIT 100</textarea></label>
      <div class="example-row"><button class="secondary example-query" type="button" data-query='FROM CfgVehicles WHERE scope EQ 2 LIMIT 100'>Visible vehicles</button><button class="secondary example-query" type="button" data-query='FROM CfgVehicles WHERE linkedItems CONTAINS "A3CDB_Test_Helmet" LIMIT 100'>Helmet relation</button><button class="secondary example-query" type="button" data-query='FROM CfgWeapons WHERE scope EQ 2 LIMIT 100'>Visible weapons</button></div>
      <div class="actions"><button id="run-a3ql" type="button">Run A3QL</button><button id="clear-a3ql" type="button" class="secondary">Clear</button></div>
      <p id="a3ql-error" class="error" role="alert" hidden></p>
    </section>

    <section class="panel" aria-labelledby="results-title"><div class="results-header"><h2 id="results-title">Results</h2><p id="status" class="muted" role="status">Ready.</p></div><div class="table-wrap"><table><thead><tr><th>Display name</th><th>Classname</th><th>Root</th><th>Parent</th></tr></thead><tbody id="results"></tbody></table></div><p id="empty-state" class="empty">Run a search to display results.</p></section>
  </main>
  <template id="filter-template"><div class="filter-row"><label>Field<select class="filter-field"><option value="classname">Classname</option><option value="displayName">Display name</option><option value="parent">Parent</option><option value="scope">Scope</option><option value="author">Author</option><option value="dlc">DLC</option><option value="faction">Faction</option><option value="linkedItems">Linked items</option></select></label><label>Operator<select class="filter-operator"><option value="eq">Equals</option><option value="contains">Contains item</option></select></label><label>Value<input class="filter-value" type="text" autocomplete="off"></label><button type="button" class="remove-filter danger" aria-label="Remove filter">Remove</button></div></template>
  <script src="/app.js"></script>
</body>
</html>
