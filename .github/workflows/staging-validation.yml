name: Validate Sanitized Staging

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile tools/a3cdb_query/public_fixture_server.py
      - run: docker build -t a3-configdb-public-staging .
