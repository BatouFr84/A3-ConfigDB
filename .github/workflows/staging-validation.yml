name: Validate Sanitized Staging

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public boundary and complete license
        run: python tools/validate_public_staging.py
      - name: Run fixture-only tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile fixture-only runtime
        run: python -m py_compile tools/a3cdb_query/public_fixture_server.py
      - name: Build public fixture image
        run: docker build -t a3-configdb-public-staging .
